# fly.toml - Configuración de deploy en Fly.io
# Reemplazá "api-prediccion-prog2" por el nombre que elijas

app = "api-prediccion-prog2"
primary_region = "gru"  # São Paulo (más cercano a Argentina)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
